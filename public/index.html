<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projekt-Hub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-icon">⚡</span><span id="brand-name">Projekt-Hub</span></div>
      <nav id="nav"></nav>
      <div class="sidebar-foot" id="storage-info"></div>
    </aside>
    <div class="main-wrap">
      <header class="topbar">
        <button class="icon-btn menu-btn" data-action="toggle-menu" aria-label="Menü">☰</button>
        <div class="crumbs" id="crumbs"></div>
      </header>
      <main id="main" class="main"></main>
    </div>
  </div>

  <dialog id="record-dialog" class="record-dialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script src="seed.js"></script>
  <script src="schema.js"></script>
  <script src="app.js"></script>
</body>
</html>
